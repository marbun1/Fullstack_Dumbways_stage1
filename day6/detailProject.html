<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Detail</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

  <style>
    body {
      background-color: #f5f5f5;
      padding-top: 90px;
      font-family: "Poppins", sans-serif;
    }
    .project-detail {
      max-width: 650px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
    #projectImage img {
      width: 100%;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 20px;
    }
    .tech-badge {
      background: #007bff;
      color: white;
      padding: 6px 10px;
      border-radius: 6px;
      margin-right: 6px;
      display: inline-block;
      font-size: 13px;
    }
    #desc {
      margin-top: 15px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="project-detail">
    <h2 id="projectTitle"></h2>

    <div id="projectImage"></div>

    <p><strong>Duration:</strong> <span id="duration"></span></p>

    <p><strong>Technologies:</strong></p>
    <div id="tech"></div>

    <p id="desc"></p>

    <a href="myProject.html" class="btn btn-secondary mt-3">⬅ Back</a>
  </div>

  <script src="asset/script/detailProject.js"></script>
</body>
</html>
