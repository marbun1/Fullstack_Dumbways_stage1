<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- CSS -->
  <link rel="stylesheet" href="asset/style/style.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>

  <title>My Project</title>
</head>
<body>

  <!-- NAVBAR -->
  <header class="navigation">
    <nav class="navigation-left">
      <i class="fa-solid fa-sailboat"></i>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a class="my-project" href="#">My Project</a></li>
      </ul>
    </nav>
    <nav class="navigation-right">
      <ul>
        <li><a href="contact.html">contact me</a></li>
      </ul>
    </nav>
  </header>

  <div class="form-myProject">
    <h2>ADD MY PROJECT</h2>

    <form id="projectForm">
      <label class="fw-semibold">Project Name</label>
      <input type="text" class="form-control mb-3" id="projectName" required>

      <div class="row">
        <div class="col">
          <label class="fw-semibold">Start Date</label>
          <input type="date" class="form-control mb-3" id="startDate" required>
        </div>
        <div class="col">
          <label class="fw-semibold">End Date</label>
          <input type="date" class="form-control mb-3" id="endDate" required>
        </div>
      </div>

      <label class="fw-semibold">Description</label>
      <textarea class="form-control mb-3" rows="4" id="description" required></textarea>

      <label class="fw-semibold">Technologies</label>
      <div class="row mb-3">
        <div class="col-6">
          <input type="checkbox" id="node"> Node Js <br>
          <input type="checkbox" id="react"> React Js
        </div>
        <div class="col-6">
          <input type="checkbox" id="next"> Next Js <br>
          <input type="checkbox" id="ts"> TypeScript
        </div>
      </div>

      <label class="fw-semibold">Upload Image</label>
      <input type="file" class="form-control mb-4" id="image" accept="image/*">

      <div class="text-end">
        <button type="submit" class="btn-submit">Submit</button>
      </div>
    </form>
  </div>

  <h3 class="mt-5 ms-4">Project List</h3>
  <div id="projectListContainer" class="ms-4 me-4">
    <div id="projectList"></div>
  </div>

  <script src="asset/script/main.js"></script>
</body>
</html>
